        .btn-danger { background: #ef4444; color: white; padding: 10px 14px; font-size: 14px; border-radius: 10px; font-weight: 700; }
        .btn-white-trans { background: rgba(255,255,255,0.22); color: white; padding: 9px 11px; border-radius: 10px; font-size: 18px; line-height: 1; }
        .btn-green { background: linear-gradient(135deg, #22c55e, #10b981); color: white; padding: 13px 16px; font-size: 14px; width: 100%; border-radius: 12px; font-weight: 700; }

        .phase-opt { width: 100%; text-align: left; padding: 12px; border-radius: 16px; border: 2px solid #e5e7eb; background: white; cursor: pointer; display: flex; align-items: flex-start; gap: 12px; transition: transform 0.1s; }

        .tip-box { padding: 12px; border-radius: 16px; background: linear-gradient(135deg,#f5f3ff,#fdf2f8); border: 2px solid #e9d5ff; }
        .warn-box { padding: 12px; border-radius: 16px; background: #fffbeb; border: 2px solid #fde68a; }

// ─────────────────────────────────────────
// STORAGE
// ─────────────────────────────────────────
const Store = {
    toLS(k,v){ try{ localStorage.setItem(k,JSON.stringify(v));return true; }catch(e){return false;} },
    fromLS(k){ try{ const d=localStorage.getItem(k);return d?JSON.parse(d):null; }catch(e){return null;} },
    toCk(k,v){
        try{
            const enc=btoa(unescape(encodeURIComponent(JSON.stringify(v))));
            document.cookie=`${k}=${enc}; max-age=${365*86400}; path=/; SameSite=Lax`;
            return true;
        }catch(e){return false;}
    },
    fromCk(k){
        try{
            for(const c of document.cookie.split(';')){
                const i=c.indexOf('='); if(i<0)continue;
                const n=c.slice(0,i).trim(), val=c.slice(i+1).trim();
                if(n===k) return JSON.parse(decodeURIComponent(escape(atob(val))));
            }
            return null;
        }catch(e){return null;}
    },
    toIDB(k,v){
        return new Promise(res=>{
            try{
                const rq=indexedDB.open('ExDB',1);
                rq.onerror=()=>res(false);
                rq.onupgradeneeded=e=>{
                    if(!e.target.result.objectStoreNames.contains('data'))
                        e.target.result.createObjectStore('data',{keyPath:'key'});
                };
                rq.onsuccess=e=>{
                    const db=e.target.result;
                    const tx=db.transaction(['data'],'readwrite');
                    tx.objectStore('data').put({key:k,value:v});
                    tx.oncomplete=()=>{db.close();res(true);};
                    tx.onerror=()=>{db.close();res(false);};
                };
            }catch(e){res(false);}
        });
    },
    fromIDB(k){
        return new Promise(res=>{
            try{
                const rq=indexedDB.open('ExDB',1);
                rq.onerror=()=>res(null);
                rq.onsuccess=e=>{
                    const db=e.target.result;
                    if(!db.objectStoreNames.contains('data')){db.close();res(null);return;}
                    const tx=db.transaction(['data'],'readonly');
                    const gr=tx.objectStore('data').get(k);
                    gr.onsuccess=()=>{db.close();res(gr.result?gr.result.value:null);};
                    gr.onerror=()=>{db.close();res(null);};
                };
            }catch(e){res(null);}
        });
    },
    async save(k,v){ this.toLS(k,v); this.toCk(k,v); await this.toIDB(k,v); },
    async load(k){
        const a=this.fromLS(k); if(a!==null) return a;
        const b=this.fromCk(k); if(b!==null) return b;
        return await this.fromIDB(k);
    }
};

function phaseStats(){
    const s={1:0,2:0,3:0,4:0};
    for(const r of Object.values(st.records)){
        const p=(r&&typeof r==='object')?r.phase:st.currentPhase;
        if(p>=1&&p<=4) s[p]++;
    }
    return s;
}
function dk(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function daysIn(y,m){ return new Date(y,m+1,0).getDate(); }
function firstDay(y,m){ return new Date(y,m,1).getDay(); }
async function persist(){
    await Store.save('exerciseRecords',st.records);
    await Store.save('exerciseNotes',st.notes);
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function isFutureDate(y, m, d) {
    const today = new Date();
    const todayMidnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const target = new Date(y, m, d);
    return target > todayMidnight;
}

function buildPage(){

${calendarCard(today, isCurMonth)}

            ${PHASES.map(p=>`
            <div class="stat-cell" style="background:${p.lightBg};">
                <div style="font-size:22px;margin-bottom:4px;">${p.icon}</div>
                <p style="font-size:20px;font-weight:700;color:${p.textColor};">${ps[p.id]||0}</p>
                <p style="font-size:11px;color:#6b7280;margin-top:2px;">阶段${p.id}</p>
            </div>`).join('')}
        </div>
    </div>`;
}

function calendarCard(today, isCurMonth){
    const days = daysIn(st.year, st.month);
    const fd = firstDay(st.year, st.month);
    let cells = '';
    for(let i=0;i<fd;i++) cells += `<div class="cal-empty"></div>`;
    for(let d=1;d<=days;d++){
        const key = dk(st.year, st.month, d);
        const rec = st.records[key];
        const checked = !!rec;
        const rp = (rec&&typeof rec==='object') ? rec.phase : st.currentPhase;
        const rph = PHASES[rp-1];
        const isToday = isCurMonth && d===today.getDate();
        const future = isFutureDate(st.year, st.month, d);
        const note = st.notes[key];
        let cls = 'cal-day';
        if(checked) cls += ' checked';
        if(isToday && !checked) cls += ' today-ring';
        if(future) cls += ' future';
        const bg = checked ? `background:${rph.grad};` : '';
        const clickAttr = future ? '' : `onclick="clickDay(${d})"`;
        // ── 日期统一左上角，用 cal-day-num ──
        cells += `<button class="${cls}" style="${bg}" ${clickAttr}>
            <span class="cal-day-num">${d}</span>
            ${checked?`<span class="cal-icon">${rph.icon}</span>`:''}
            ${note?`<span class="cal-note">${esc(note)}</span>`:''}
        </button>`;
    }
    // ── 日历卡片全宽，抵消 page 的 12px 左右内边距 ──
    return `<div class="card" style="margin-left:-12px;margin-right:-12px;padding:16px 8px;">
        <div class="row-sb mb12">
            <button class="btn btn-ghost" style="padding:8px 14px;font-size:18px;" onclick="prevMonth()">‹</button>
            <div style="text-align:center;flex:1;">
                <h2 class="grad-text" style="font-size:20px;font-weight:700;">${st.year}年 ${MONTHS[st.month]}</h2>
                ${!isCurMonth?`<button onclick="goToday()" style="font-size:11px;color:#a855f7;font-weight:600;background:none;border:none;cursor:pointer;margin-top:4px;">回到今天 →</button>`:''}
            </div>
            <button class="btn btn-ghost" style="padding:8px 14px;font-size:18px;" onclick="nextMonth()">›</button>
        </div>
        <div class="cal-grid mb8">
            ${['日','一','二','三','四','五','六'].map(d=>`<div class="cal-hd">${d}</div>`).join('')}
        </div>
        <div class="cal-grid">${cells}</div>
        <div class="tip-box mt12">
            <p style="font-size:11px;color:#374151;font-weight:700;margin-bottom:6px;">💡 提示：</p>
            <p style="font-size:11px;color:#6b7280;margin-bottom:6px;">点击今天或过去的日期打卡，笔记可选填</p>
            <div class="row gap8" style="flex-wrap:wrap;">
                ${PHASES.map(p=>`<div class="row gap8">
                    <div style="width:20px;height:20px;border-radius:6px;background:${p.grad};display:flex;align-items:center;justify-content:center;font-size:10px;color:white;font-weight:700;">${p.id}</div>
                    <span style="font-size:11px;color:#6b7280;">阶段${p.id}</span>
                </div>`).join('')}
            </div>
        </div>
    </div>`;
}

// ─────────────────────────────────────────
// MODALS
// ─────────────────────────────────────────
function buildModals(){
    let html = '';
    if(st.showNameInput) html += nameModal();
    if(st.showPhaseSelector) html += phaseSelectorModal();
    if(st.showMenu) html += menuModal();
    if(st.selectedDate) html += noteModal();
    if(st.confirmMsg) html += confirmModal();
    if(st.exportData) html += exportModal();
    return html;
}

function nameModal(){
    return `<div class="overlay center">
        <div class="popup">
            <div style="text-align:center;margin-bottom:20px;">
                <div style="font-size:56px;margin-bottom:12px;">🎉</div>
                <h2 class="grad-text" style="font-size:22px;font-weight:700;margin-bottom:6px;">欢迎使用</h2>
                <p style="color:#6b7280;font-size:13px;">苹果型身材运动打卡记录</p>
            </div>
            <label style="display:block;font-size:13px;font-weight:700;color:#374151;margin-bottom:8px;">请输入你的昵称：</label>
            <input id="nameInp" class="inp mb16" type="text" placeholder="例如：小美" value="${esc(st.userName)}" oninput="st.userName=this.value" onkeydown="if(event.key==='Enter')saveUserName()">
            <button class="btn btn-primary" onclick="saveUserName()">下一步 →</button>

}

                <button class="phase-opt mb8" style="${st.currentPhase===p.id?`border-color:${p.borderColor};border-width:3px;box-shadow:0 4px 20px rgba(0,0,0,0.1);`:''}" onclick="selectPhase(${p.id})">
                    <span style="font-size:28px;">${p.icon}</span>
                    <div style="flex:1;">
                        <p style="font-size:13px;font-weight:700;color:${p.textColor};margin-bottom:3px;">${esc(p.name)}</p>
                        <p style="font-size:11px;color:#6b7280;margin-bottom:3px;">${esc(p.subtitle)}</p>
                        <p style="font-size:11px;font-weight:700;color:#374151;">${esc(p.core)}</p>
                    </div>
                </button>`).join('')}
                <div class="warn-box mt8">
                    <p style="font-size:12px;color:#92400e;">💡 别担心，你随时可以在设置中切换阶段</p>
                </div>
            </div>
        </div>
    </div>`;
}

function menuModal(){
    const ps = phaseStats();
    return `<div class="overlay">
        <div class="sheet">
            <div class="sheet-hdr">
                <h2 class="grad-text" style="font-size:18px;font-weight:700;">设置与阶段详情</h2>
                <button class="btn btn-ghost" style="padding:8px;" onclick="closeMenu()">✕</button>
            </div>
            <div class="sheet-body">
                <p style="font-size:14px;font-weight:700;color:#1f2937;margin-bottom:12px;">切换阶段</p>
                ${PHASES.map(p=>`
                <button class="phase-opt mb12" style="${st.currentPhase===p.id?`border-color:${p.borderColor};border-width:3px;`:''}" onclick="changePhase(${p.id})">
                    <div style="flex:1;">
                        <div class="row gap8 mb8">
                            <span style="font-size:26px;">${p.icon}</span>
                            <div style="flex:1;">
                                <div class="row gap8 mb4">
                                    <p style="font-size:13px;font-weight:700;color:${p.textColor};">${esc(p.name)}</p>
                                    ${st.currentPhase===p.id?`<span style="font-size:10px;background:#a855f7;color:white;padding:2px 6px;border-radius:99px;font-weight:700;white-space:nowrap;">当前</span>`:''}
                                </div>
                                <p style="font-size:11px;color:#6b7280;">${esc(p.subtitle)}</p>
                                <p style="font-size:11px;font-weight:700;color:#a855f7;margin-top:2px;">${ps[p.id]||0}天</p>
                            </div>
                        </div>
                        <p style="font-size:11px;font-weight:700;color:#374151;margin-bottom:4px;">💡 ${esc(p.core)}</p>
                        <p style="font-size:11px;color:#6b7280;margin-bottom:6px;">${esc(p.desc)}</p>
                        <p style="font-size:11px;font-weight:700;color:#374151;margin-bottom:3px;">🎯 目标</p>
                        ${p.goals.map(g=>`<p style="font-size:11px;color:#6b7280;margin-left:8px;margin-bottom:2px;">• ${esc(g)}</p>`).join('')}
                        <p style="font-size:11px;font-weight:700;color:#374151;margin-bottom:3px;margin-top:6px;">📝 要点</p>
                        ${p.tips.map(t=>`<p style="font-size:11px;color:#6b7280;margin-left:8px;margin-bottom:2px;">• ${esc(t)}</p>`).join('')}
                    </div>
                </button>`).join('')}
                <p style="font-size:14px;font-weight:700;color:#1f2937;margin-bottom:10px;">数据管理</p>
                <button class="btn btn-green mb8" onclick="exportData()">📤 导出备份</button>
                <label class="btn btn-blue mb16" style="display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;">
                    📥 导入数据
                    <input type="file" accept=".json" onchange="importData(event)" style="display:none;">
                </label>
                <div class="warn-box mb12">
                    <p style="font-weight:700;color:#92400e;margin-bottom:6px;font-size:13px;">⚠️ 重要提醒</p>
                    <p style="font-size:12px;color:#92400e;line-height:1.6;">• 数据已三重备份（localStorage + Cookie + IndexedDB）<br>• 建议每月导出备份到微信收藏或云盘<br>• 换手机前务必导出数据<br>• 清理浏览器数据会删除所有记录</p>

                    <p style="font-weight:700;color:#1e40af;margin-bottom:6px;font-size:13px;">📱 使用技巧</p>

                </div>

function noteModal(){
    const isChecked = !!st.records[st.selectedDate];
    return `<div class="overlay center">
        <div class="popup" style="max-width:440px;width:100%;">
            <h2 class="grad-text" style="font-size:18px;font-weight:700;margin-bottom:4px;">📝 ${st.selectedDate}</h2>
            <p style="font-size:12px;color:#6b7280;margin-bottom:12px;">点击"完成打卡"即可记录，笔记可选填</p>
            <textarea id="noteTA" class="inp mb12" placeholder="记录今天的运动内容（可选）...

例如：走路8000步 / 超慢跑30分钟
感觉很棒！" oninput="st.currentNote=this.value"></textarea>
            <div class="row gap8">
                <button class="btn btn-primary" style="flex:1;" onclick="saveNote()">✅ 完成打卡</button>
                ${isChecked?`<button class="btn btn-danger" onclick="askDelete()">删除</button>`:''}
                <button class="btn btn-ghost" onclick="cancelNote()">取消</button>
            </div>
        </div>
    </div>`;
}

function confirmModal(){
    return `<div class="overlay center">
        <div style="background:white;border-radius:20px;padding:24px;max-width:300px;width:100%;text-align:center;">
            <p style="font-size:16px;font-weight:700;color:#1f2937;margin-bottom:16px;">${esc(st.confirmMsg)}</p>
            <div class="row gap8">
                <button class="btn btn-danger" style="flex:1;" onclick="confirmYes()">确定</button>
                <button class="btn btn-ghost" style="flex:1;" onclick="confirmNo()">取消</button>
            </div>
        </div>
    </div>`;
}

function exportModal(){
    return `<div class="overlay center">
        <div class="popup" style="max-width:440px;width:100%;">
            <h2 style="font-size:16px;font-weight:700;color:#1f2937;margin-bottom:8px;">📋 备份数据</h2>
            <p style="font-size:12px;color:#6b7280;margin-bottom:10px;">请复制以下内容，保存到备忘录或微信收藏：</p>
            <textarea style="width:100%;height:140px;font-size:11px;border:2px solid #e5e7eb;border-radius:10px;padding:8px;resize:none;background:#f9fafb;font-family:monospace;" readonly>${esc(st.exportData)}</textarea>
            <div class="row gap8 mt12">
                <button class="btn btn-primary" style="flex:1;" onclick="copyExport()">📋 复制</button>
                <button class="btn btn-ghost" onclick="closeExport()">关闭</button>
            </div>
        </div>
    </div>`;
}

// ─────────────────────────────────────────
// EVENT HANDLERS
// ─────────────────────────────────────────
function clickDay(d){
    if(isFutureDate(st.year, st.month, d)) return;
    const key = dk(st.year, st.month, d);
    st.selectedDate = key;
    st.currentNote = st.notes[key] || '';
    render();
}
function saveNote(){
    if(!st.selectedDate) return;
    const key = st.selectedDate;
    if(st.currentNote.trim()){
        st.notes[key] = st.currentNote.trim();
    } else {
        delete st.notes[key];
    }
    st.records[key] = { phase: st.currentPhase };
    st.selectedDate = null;
    st.currentNote = '';
    render();
    persist();
}
function cancelNote(){ st.selectedDate=null; st.currentNote=''; render(); }
function askDelete(){ showConfirm('确定要删除这天的记录吗？', doDelete); }
function doDelete(){
    if(!st.selectedDate) return;
    delete st.records[st.selectedDate];
    delete st.notes[st.selectedDate];
    st.selectedDate = null;
    st.currentNote = '';
    render();
    persist();
}
function prevMonth(){
    if(st.month===0){ st.month=11; st.year--; } else st.month--;
    render();
}
function nextMonth(){
    if(st.month===11){ st.month=0; st.year++; } else st.month++;
    render();
}
function goToday(){
    const t=new Date(); st.year=t.getFullYear(); st.month=t.getMonth();
    render();
}
function toggleDetail(){ st.showPhaseDetail=!st.showPhaseDetail; render(); }
function openMenu(){ st.showMenu=true; render(); }
function closeMenu(){ st.showMenu=false; render(); }
function openPhaseSelector(){ st.showPhaseDetail=false; st.showPhaseSelector=true; render(); }
function closePhaseSelector(){ st.showPhaseSelector=false; render(); }
function selectPhase(id){
    st.currentPhase=id;
    st.showPhaseSelector=false;
    render();
    Store.save('currentPhase',id);
}
function changePhase(id){
    st.currentPhase=id;
    st.showMenu=false;
    render();
    Store.save('currentPhase',id);
}
function showConfirm(msg, cb){ st.confirmMsg=msg; st.confirmCb=cb; render(); }
function confirmYes(){ if(st.confirmCb) st.confirmCb(); st.confirmMsg=''; st.confirmCb=null; render(); }
function confirmNo(){ st.confirmMsg=''; st.confirmCb=null; render(); }
function exportData(){
    const data = JSON.stringify({ records:st.records, notes:st.notes, userName:st.userName, currentPhase:st.currentPhase, exportDate:new Date().toISOString() }, null, 2);
    try {
        const blob = new Blob([data],{type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href=url; a.download=`${st.userName||'打卡'}_运动记录_${new Date().toISOString().slice(0,10)}.json`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        st.exportData = data;
        st.showMenu = false;
        render();
    } catch(e) {
        st.exportData = data;
        st.showMenu = false;
        render();
    }
}
function closeExport(){ st.exportData=null; render(); }
function copyExport(){
    const ta = document.querySelector('#app textarea[readonly]');
    if(!ta) return;
    try {
        if(navigator.clipboard){
            navigator.clipboard.writeText(ta.value).then(()=>alert('✅ 已复制！'));
        } else {
            ta.select(); document.execCommand('copy'); alert('✅ 已复制！');
        }
    } catch(e){ ta.select(); document.execCommand('copy'); }
}
function importData(e){
    const file = e.target.files&&e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async ev => {
        try{
            const data = JSON.parse(ev.target.result);
            showConfirm('导入将覆盖当前数据，确定吗？', async ()=>{
                st.records = data.records||{};
                st.notes = data.notes||{};
                if(data.userName) st.userName=data.userName;
                if(data.currentPhase) st.currentPhase=data.currentPhase;
                st.showMenu=false;
                render();
                await persist();
                await Store.save('userName',st.userName);
                await Store.save('currentPhase',st.currentPhase);
                alert('✅ 数据导入成功！');
            });
        } catch(err){ alert('❌ 文件格式错误'); }
    };
    reader.readAsText(file);
}
function saveUserName(){
    const nm = (st.userName||'').trim();
    if(!nm) return;
    st.userName=nm;
    st.showNameInput=false;
    Store.save('userName',nm);
    if(!(st.currentPhase>=1&&st.currentPhase<=4)){
        st.showPhaseSelector=true;
    }
    render();
}

// ─────────────────────────────────────────
// INIT
// ─────────────────────────────────────────
(async function init(){
    try {
        const [name, phase, records, notes] = await Promise.all([
            Store.load('userName'),
            Store.load('currentPhase'),
            Store.load('exerciseRecords'),
            Store.load('exerciseNotes')
        ]);
        if(name) st.userName=name; else st.showNameInput=true;
        const pNum = parseInt(phase);
        if(pNum>=1&&pNum<=4) st.currentPhase=pNum; else if(!name) st.showPhaseSelector=true;
        if(!name&&pNum>=1&&pNum<=4) st.showPhaseSelector=true;
        if(records) st.records=records;
        if(notes) st.notes=notes;
        const now = new Date();
        st.year = now.getFullYear();
        st.month = now.getMonth();
    } catch(e){
        st.showNameInput=true;
    }
    render();
})();
</script>
